<svg xmlns="http://www.w3.org/2000/svg" width="660" height="412" viewBox="0 0 660 412" font-family="Helvetica,Arial,sans-serif" font-size="12.5" role="img" aria-label="How Termux Vault hands a command to Termux"><title>How Termux Vault hands a command to Termux</title><rect x="0.5" y="0.5" width="659" height="411" rx="8" fill="#ffffff" stroke="#d0d7de"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0L9,4.5L0,9z" fill="#16232A"/></marker></defs><rect x="28" y="12" width="124" height="30" rx="6" fill="#16232A"/><text x="90" y="32" text-anchor="middle" fill="#fff" font-weight="bold">You</text><line x1="90" y1="42" x2="90" y2="400" stroke="#aab" stroke-dasharray="4 4"/><rect x="268" y="12" width="124" height="30" rx="6" fill="#16232A"/><text x="330" y="32" text-anchor="middle" fill="#fff" font-weight="bold">Termux Vault</text><line x1="330" y1="42" x2="330" y2="400" stroke="#aab" stroke-dasharray="4 4"/><rect x="508" y="12" width="124" height="30" rx="6" fill="#16232A"/><text x="570" y="32" text-anchor="middle" fill="#fff" font-weight="bold">Termux</text><line x1="570" y1="42" x2="570" y2="400" stroke="#aab" stroke-dasharray="4 4"/><line x1="90" y1="80" x2="330" y2="80" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="210.0" y="70" text-anchor="middle" fill="#222">Passphrase or biometric</text><path d="M330,118 h46 v22 h-44" fill="none" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="384" y="132" fill="#222">Decrypt the one command</text><line x1="330" y1="172" x2="570" y2="172" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="450.0" y="162" text-anchor="middle" fill="#222">Start service (title and one-run tokens only)</text><line x1="570" y1="218" x2="330" y2="218" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="450.0" y="208" text-anchor="middle" fill="#222">Connect to 127.0.0.1, prove the client token</text><line x1="330" y1="264" x2="570" y2="264" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="450.0" y="254" text-anchor="middle" fill="#222">Prove the server token, then send the command</text><path d="M330,302 h46 v22 h-44" fill="none" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="384" y="316" fill="#222">Wipe command from memory</text><line x1="570" y1="356" x2="90" y2="356" stroke="#16232A" stroke-width="1.5" marker-end="url(#a)"/><text x="330.0" y="346" text-anchor="middle" fill="#222">Run it, show the result</text></svg>