name: Release

# Triggers on a version tag (v1.0.0, v1.1.0, ...). Builds the release APK signed with the real
# keystore, verifies it is signed with the expected key before anything is published, and
# attaches it to the GitHub Release for that tag - the file F-Droid's own build picks up and
# compares against (Binaries: in the fdroiddata metadata).
#
# Signing values reach Gradle as ORG_GRADLE_PROJECT_* environment variables, so they never appear
# on a command line.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64   the keystore file, base64-encoded
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD
#
# None of these is written to a log, a workflow output or the repository. The decoded keystore
# is removed at the end of the job whether or not the build succeeded.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check the tag matches the version in the build
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag: $TAG_VERSION   versionName: $BUILD_VERSION"
          if [ "$TAG_VERSION" != "$BUILD_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $BUILD_VERSION in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode the release keystore
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          ORG_GRADLE_PROJECT_vaultSigningStoreFile: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_vaultSigningStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_vaultSigningKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_vaultSigningKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and rename the APK for the release
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "No release APK was produced" >&2
            exit 1
          fi
          DEST="TermuxVault-v${VERSION}.apk"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # Fails the release before it is published if the build was signed with the wrong key
      # (or not signed at all) - the case the AllowedAPKSigningKeys check in fdroiddata exists
      # to catch, caught here first.
      - name: Verify the signing certificate matches the expected key
        env:
          EXPECTED_FINGERPRINT: e8503bc245fa92e4238dd741cbc6ec87d5bf945843d6248a1364ba3c880abc37
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          ACTUAL=$("$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" \
            | grep 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "Expected: $EXPECTED_FINGERPRINT"
          echo "Actual:   $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Signing certificate does not match the expected fingerprint - refusing to publish"
            exit 1
          fi

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      # The release notes are the per-version changelog that F-Droid also shows, so there is one
      # file to keep, not two.
      - name: Find this version's changelog
        id: changelog
        run: |
          set -euo pipefail
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          FILE="metadata/en-US/changelogs/${VERSION_CODE}.txt"
          if [ ! -f "$FILE" ]; then
            echo "::error::No changelog at $FILE for versionCode $VERSION_CODE - add one before tagging a release."
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload the signed APK to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          body_path: ${{ steps.changelog.outputs.path }}
